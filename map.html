<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주유 지도 — 최저가 주유소</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
  :root {
    --bg:#F7F8FA;--surface:#FFFFFF;--surface2:#F0F2F5;--border:#E4E7EC;
    --text-primary:#111827;--text-secondary:#6B7280;--text-muted:#9CA3AF;
    --accent:#2563EB;--accent-light:#EFF6FF;--green:#16A34A;--green-light:#F0FDF4;
    --red:#DC2626;--red-light:#FEF2F2;--shadow-sm:0 1px 3px rgba(0,0,0,0.07);
    --radius:14px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased;}

  /* 헤더 */
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .header-left{display:flex;align-items:center;gap:10px;}
  .header-icon{width:34px;height:34px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .header h1{font-size:16px;font-weight:700;}
  .header p{font-size:11px;color:var(--text-muted);margin-top:1px;}
  .nav-back{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none;padding:6px 10px;border-radius:var(--radius-sm);background:var(--accent-light);}

  .main{max-width:600px;margin:0 auto;padding:14px 14px 40px;}

  /* 가격 배너 */
  .price-banner{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:12px;}
  .price-banner-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;}
  .price-rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .price-row{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;}
  .price-region{font-size:12px;color:var(--text-secondary);margin-bottom:4px;}
  .price-val{font-size:18px;font-weight:700;color:var(--accent);}
  .price-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .price-loading{font-size:13px;color:var(--text-muted);text-align:center;padding:8px;}

  /* 컨트롤 바 */
  .control-bar{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
  .refresh-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;white-space:nowrap;}
  .refresh-btn:hover{background:#1d4ed8;}
  .refresh-btn:disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed;}
  .status-chip{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex-shrink:0;}
  .dot.active{background:var(--green);animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

  /* 필터 정보 */
  .filter-info{background:#FEF3C7;border-radius:var(--radius-sm);padding:9px 12px;font-size:12px;color:#92400E;margin-bottom:10px;line-height:1.5;}

  /* 지도 */
  .map-wrap{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:12px;position:relative;}
  #kakaoMap{width:100%;height:380px;}
  .map-loading{position:absolute;inset:0;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:13px;color:var(--text-muted);z-index:10;}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 주유소 리스트 */
  .list-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
  .list-title{font-size:15px;font-weight:700;}
  .list-count{font-size:12px;color:var(--text-muted);}

  .station-card{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);padding:14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:border-color 0.15s;}
  .station-card:hover{border-color:var(--accent);}
  .station-card.best{border-color:var(--green);}
  .s-rank{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-secondary);flex-shrink:0;margin-top:2px;}
  .s-rank.r1{background:#FEF9C3;color:#854D0E;}
  .s-info{flex:1;min-width:0;}
  .s-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .s-brand{font-size:11px;color:var(--text-muted);margin-top:1px;}
  .s-addr{font-size:11px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .s-dist{font-size:11px;color:var(--text-secondary);margin-top:3px;font-weight:500;}
  .s-price{text-align:right;flex-shrink:0;}
  .s-price-val{font-size:16px;font-weight:700;color:var(--accent);}
  .s-price-lbl{font-size:10px;color:var(--text-muted);margin-top:1px;}
  .s-diff{font-size:11px;color:var(--green);font-weight:600;margin-top:2px;}

  .empty-box{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:32px;text-align:center;color:var(--text-muted);font-size:13px;line-height:1.6;}
  .error-box{background:var(--red-light);border:1px solid #FECACA;border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--red);line-height:1.5;margin-bottom:10px;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-icon">🗺️</div>
    <div>
      <h1>최저가 주유소 지도</h1>
      <p>반경 10km · 휘발유 최저가 +10원 이내</p>
    </div>
  </div>
  <a href="index.html" class="nav-back">← 가성비 계산기</a>
</div>

<div class="main">

  <!-- 서울/경기 최저가 배너 -->
  <div class="price-banner">
    <div class="price-banner-title">📊 오피넷 실시간 지역 최저가 (휘발유)</div>
    <div class="price-rows">
      <div class="price-row">
        <div class="price-region">🏙️ 서울</div>
        <div class="price-val" id="seoulPrice">조회 중...</div>
        <div class="price-sub" id="seoulSub"></div>
      </div>
      <div class="price-row">
        <div class="price-region">🌆 경기도</div>
        <div class="price-val" id="gyeonggiPrice">조회 중...</div>
        <div class="price-sub" id="gyeonggiSub"></div>
      </div>
    </div>
  </div>

  <!-- 컨트롤 바 -->
  <div class="control-bar">
    <button class="refresh-btn" id="refreshBtn" onclick="startSearch()">
      📍 위치 새로고침
    </button>
    <div class="status-chip">
      <div class="dot" id="locDot"></div>
      <span id="locText">버튼을 눌러 시작하세요</span>
    </div>
  </div>

  <!-- 필터 안내 -->
  <div class="filter-info" id="filterInfo" style="display:none;">
    ⛽ <span id="filterText"></span>
  </div>

  <!-- 에러 -->
  <div id="errorBox" class="error-box hidden"></div>

  <!-- 지도 -->
  <div class="map-wrap">
    <div id="kakaoMap"></div>
    <div class="map-loading" id="mapLoading">
      <div class="spinner"></div>
      <span id="mapLoadingText">위치를 가져오는 중...</span>
    </div>
  </div>

  <!-- 주유소 리스트 -->
  <div class="list-header">
    <div class="list-title">📋 주유소 목록 <span style="font-size:12px;font-weight:400;color:var(--text-muted)">(거리순)</span></div>
    <div class="list-count" id="listCount"></div>
  </div>
  <div id="stationList">
    <div class="empty-box">위치 새로고침 버튼을 눌러<br>주변 최저가 주유소를 검색하세요</div>
  </div>

</div>

<!-- 카카오맵 SDK: YOUR_JS_KEY_HERE 를 실제 JavaScript 키로 교체하세요 -->
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=b66d4664b0c4437186961aab66b99b6a&libraries=services"></script>
<script>
var WORKER_URL = 'https://fuel-proxy.kim80091.workers.dev';
var RADIUS_KM = 10;
var PRICE_MARGIN = 10; // 최저가 +10원 이내

var userLat = null, userLng = null;
var kakaoMap = null;
var markers = [];
var infowindow = null;
var minPriceSeoul = null, minPriceGyeonggi = null;

var BRAND = {
  SKE:{label:'SK에너지',emoji:'🔴',bg:'#FEF2F2'},
  GSC:{label:'GS칼텍스',emoji:'🟢',bg:'#F0FDF4'},
  HDO:{label:'현대오일뱅크',emoji:'🔵',bg:'#EFF6FF'},
  SOL:{label:'S-OIL',emoji:'🟡',bg:'#FFFBEB'},
  RTE:{label:'에쓰오일',emoji:'🟡',bg:'#FFFBEB'},
  RTX:{label:'알뜰',emoji:'💜',bg:'#F5F3FF'},
  NHO:{label:'농협알뜰',emoji:'💚',bg:'#F0FDF4'},
  ETC:{label:'자영',emoji:'⚪',bg:'#F9FAFB'}
};
function brandInfo(code){ return BRAND[code]||{label:code,emoji:'⛽',bg:'#F7F8FA'}; }

function haversineKm(lat1,lng1,lat2,lng2){
  var R=6371,D2R=Math.PI/180;
  var dLat=(lat2-lat1)*D2R,dLng=(lng2-lng1)*D2R;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*D2R)*Math.cos(lat2*D2R)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── 지역 최저가 조회 ────────────────────────────────────
async function fetchRegionPrices(){
  try {
    var r1 = await fetch(WORKER_URL+'/region-price?area=01&prodcd=B027'); // 서울
    var r2 = await fetch(WORKER_URL+'/region-price?area=13&prodcd=B027'); // 경기
    var d1 = await r1.json();
    var d2 = await r2.json();
    if(d1.minPrice){
      minPriceSeoul = d1.minPrice;
      document.getElementById('seoulPrice').textContent = d1.minPrice.toLocaleString()+'원/L';
      document.getElementById('seoulSub').textContent = d1.stationName||'';
    }
    if(d2.minPrice){
      minPriceGyeonggi = d2.minPrice;
      document.getElementById('gyeonggiPrice').textContent = d2.minPrice.toLocaleString()+'원/L';
      document.getElementById('gyeonggiSub').textContent = d2.stationName||'';
    }
  } catch(e) {
    document.getElementById('seoulPrice').textContent = '조회 실패';
    document.getElementById('gyeonggiPrice').textContent = '조회 실패';
  }
}

// ── 지도 초기화 ─────────────────────────────────────────
function initMap(lat, lng){
  var container = document.getElementById('kakaoMap');
  var options = {
    center: new kakao.maps.LatLng(lat, lng),
    level: 5
  };
  kakaoMap = new kakao.maps.Map(container, options);
  kakaoMap.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  infowindow = new kakao.maps.InfoWindow({zIndex:1});

  // 내 위치 마커
  var myMarkerImg = new kakao.maps.MarkerImage(
    'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
    new kakao.maps.Size(24,35)
  );
  new kakao.maps.Marker({
    map: kakaoMap,
    position: new kakao.maps.LatLng(lat, lng),
    image: myMarkerImg,
    title: '내 위치'
  });
}

// ── 마커 초기화 ─────────────────────────────────────────
function clearMarkers(){
  for(var i=0;i<markers.length;i++) markers[i].setMap(null);
  markers=[];
}

// ── 주유소 마커 추가 ────────────────────────────────────
function addMarkers(stations){
  clearMarkers();
  stations.forEach(function(s, idx){
    if(!s.lat||!s.lng) return;
    var pos = new kakao.maps.LatLng(s.lat, s.lng);
    var b = brandInfo(s.brand);
    var marker = new kakao.maps.Marker({
      map: kakaoMap,
      position: pos,
      title: s.name
    });
    (function(station, m, i){
      kakao.maps.event.addListener(m, 'click', function(){
        var content = '<div style="padding:10px 12px;min-width:160px;font-family:Pretendard,sans-serif;">'
          +'<div style="font-size:13px;font-weight:700;margin-bottom:4px;">'+station.name+'</div>'
          +'<div style="font-size:12px;color:#6B7280;margin-bottom:6px;">'+b.label+'</div>'
          +'<div style="font-size:16px;font-weight:700;color:#2563EB;">'+station.price.toLocaleString()+'원/L</div>'
          +'<div style="font-size:11px;color:#9CA3AF;margin-top:3px;">직선 '+station.distKm.toFixed(2)+'km</div>'
          +'</div>';
        infowindow.setContent(content);
        infowindow.open(kakaoMap, m);
        // 리스트 하이라이트
        var el = document.getElementById('s-card-'+i);
        if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
      });
    })(s, marker, idx);
    markers.push(marker);
  });
}

// ── 검색 시작 ───────────────────────────────────────────
function startSearch(){
  var btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 위치 확인 중...';
  document.getElementById('errorBox').classList.add('hidden');
  document.getElementById('mapLoading').style.display = 'flex';
  document.getElementById('mapLoadingText').textContent = '위치를 가져오는 중...';

  if(!navigator.geolocation){ showError('위치 서비스 미지원'); return; }
  navigator.geolocation.getCurrentPosition(
    function(pos){
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      document.getElementById('locDot').className = 'dot active';
      document.getElementById('locText').textContent = userLat.toFixed(4)+', '+userLng.toFixed(4);
      fetchAddress(userLat, userLng);
      if(!kakaoMap) initMap(userLat, userLng);
      else kakaoMap.setCenter(new kakao.maps.LatLng(userLat, userLng));
      fetchStations();
    },
    function(){
      userLat = 37.5013; userLng = 127.1000;
      document.getElementById('locDot').className = 'dot active';
      document.getElementById('locText').textContent = '시연 — 송파구';
      if(!kakaoMap) initMap(userLat, userLng);
      else kakaoMap.setCenter(new kakao.maps.LatLng(userLat, userLng));
      fetchStations();
    },
    {timeout:8000}
  );
}

async function fetchAddress(lat,lng){
  try {
    var res = await fetch(WORKER_URL+'/geocode?lat='+lat+'&lng='+lng);
    var d = await res.json();
    if(d.address) document.getElementById('locText').textContent = d.address;
  } catch(e){}
}

// ── 주유소 조회 ─────────────────────────────────────────
async function fetchStations(){
  document.getElementById('mapLoadingText').textContent = '주유소 가격 조회 중...';
  try {
    var res = await fetch(WORKER_URL+'/stations?lat='+userLat+'&lng='+userLng+'&radius='+RADIUS_KM+'&prodcd=B027');
    var data = await res.json();
    if(!data.stations||data.stations.length===0){ showError('반경 내 주유소가 없습니다.'); return; }

    // 직선거리 추가
    var stations = data.stations.map(function(s){
      return Object.assign({},s,{distKm: haversineKm(userLat,userLng,s.lat||userLat,s.lng||userLng)});
    });

    // 최저가 기준 필터 (지역 최저가 조회 실패 시 검색 결과 내 최저가 사용)
    var localMin = Math.min.apply(null, stations.map(function(s){return s.price;}));
    var basePrice = minPriceSeoul ? Math.min(minPriceSeoul, minPriceGyeonggi||minPriceSeoul) : localMin;
    var threshold = basePrice + PRICE_MARGIN;

    var filtered = stations.filter(function(s){ return s.price <= threshold; });
    if(filtered.length===0){
      // 필터 결과 없으면 최저가 +50원까지 완화
      threshold = localMin + 50;
      filtered = stations.filter(function(s){ return s.price <= threshold; });
    }

    // 거리순 정렬
    filtered.sort(function(a,b){ return a.distKm - b.distKm; });

    // 필터 안내
    var filterEl = document.getElementById('filterInfo');
    filterEl.style.display = 'block';
    document.getElementById('filterText').textContent =
      '기준 최저가 '+basePrice.toLocaleString()+'원/L 기준 +'+PRICE_MARGIN+'원('+threshold.toLocaleString()+'원/L) 이내 주유소 '+filtered.length+'곳';

    addMarkers(filtered);
    renderList(filtered, localMin);
    document.getElementById('mapLoading').style.display = 'none';
    document.getElementById('refreshBtn').disabled = false;
    document.getElementById('refreshBtn').textContent = '📍 위치 새로고침';

  } catch(e){ showError('조회 실패: '+e.message); }
}

// ── 리스트 렌더링 ────────────────────────────────────────
function renderList(stations, minPrice){
  document.getElementById('listCount').textContent = stations.length+'개';
  if(stations.length===0){
    document.getElementById('stationList').innerHTML = '<div class="empty-box">조건에 맞는 주유소가 없습니다.</div>';
    return;
  }
  document.getElementById('stationList').innerHTML = stations.map(function(s,idx){
    var b = brandInfo(s.brand);
    var diff = s.price - minPrice;
    var isFirst = idx===0;
    return '<div class="station-card'+(isFirst?' best':'')+'" id="s-card-'+idx+'" onclick="focusMarker('+idx+','+s.lat+','+s.lng+')">'
      +'<div class="s-rank'+(isFirst?' r1':'')+'">'+(idx+1)+'</div>'
      +'<div class="s-info">'
        +'<div class="s-name">'+s.name+'</div>'
        +'<div class="s-brand">'+b.emoji+' '+b.label+'</div>'
        +'<div class="s-addr">'+(s.address||'주소 미제공')+'</div>'
        +'<div class="s-dist">직선 '+s.distKm.toFixed(2)+'km</div>'
      +'</div>'
      +'<div class="s-price">'
        +'<div class="s-price-val">'+s.price.toLocaleString()+'</div>'
        +'<div class="s-price-lbl">원/L</div>'
        +(diff===0?'<div class="s-diff">최저가</div>':'<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">+'+diff+'원</div>')
      +'</div>'
    +'</div>';
  }).join('');
}

function focusMarker(idx, lat, lng){
  if(!kakaoMap||!lat||!lng) return;
  kakaoMap.setCenter(new kakao.maps.LatLng(lat,lng));
  kakaoMap.setLevel(3);
  if(markers[idx]) kakao.maps.event.trigger(markers[idx],'click');
}

function showError(msg){
  document.getElementById('mapLoading').style.display = 'none';
  document.getElementById('errorBox').textContent = '⚠️ '+msg;
  document.getElementById('errorBox').classList.remove('hidden');
  document.getElementById('refreshBtn').disabled = false;
  document.getElementById('refreshBtn').textContent = '📍 위치 새로고침';
}

// ── 초기 실행 ───────────────────────────────────────────
window.onload = function(){
  document.getElementById('mapLoading').style.display = 'none';
  fetchRegionPrices();
};
</script>
</body>
</html>
